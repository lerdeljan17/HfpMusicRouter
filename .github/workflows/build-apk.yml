name: Build and release Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HfpMusicRouter.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HfpMusicRouter-debug-apk
          path: HfpMusicRouter.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v1.0.${{ github.run_number }}
        run: |
          gh release create "$TAG_NAME" HfpMusicRouter.apk \
            --target "$GITHUB_SHA" \
            --title "HFP Music Router $TAG_NAME" \
            --notes "Automatic APK build. Captures eligible Android playback audio and routes it through Bluetooth HFP/SCO. Audio quality is limited to the hands-free profile." \
            --latest
